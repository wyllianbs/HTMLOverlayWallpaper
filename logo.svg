<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d99f3"/>
      <stop offset="1" stop-color="#0b3a66"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2e33"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="48" y="48" width="416" height="416" rx="72"/>
    </clipPath>
  </defs>

  <!-- Wallpaper canvas -->
  <rect x="48" y="48" width="416" height="416" rx="72" fill="url(#sky)"/>

  <!-- Slideshow scene: sun + mountains -->
  <g clip-path="url(#round)">
    <circle cx="170" cy="168" r="46" fill="#ffd15c"/>
    <path d="M48 372 L170 250 L250 330 L330 236 L464 372 L464 464 L48 464 Z" fill="#0e5a8a" opacity="0.95"/>
    <path d="M48 400 L150 320 L250 400 L360 300 L464 392 L464 464 L48 464 Z" fill="#0a3f63"/>
  </g>

  <!-- HTML overlay panel (bottom-right) -->
  <g>
    <rect x="250" y="264" width="176" height="132" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-width="8"/>
    <!-- code symbol </> -->
    <g fill="none" stroke="#1d99f3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="312,300 288,330 312,360"/>
      <polyline points="364,300 388,330 364,360"/>
      <line x1="344" y1="292" x2="332" y2="368" stroke="#ffd15c"/>
    </g>
  </g>
</svg>
